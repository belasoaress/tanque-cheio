[project]
name = "tanque"
version = "0.1.0"
description = "Text-to-SQL em português sobre os preços de combustíveis da ANP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "duckdb",
    "huggingface-hub",
    "polars",
    "pyarrow",
    "python-dotenv",
    "rapidfuzz",
    "sqlglot",
    "typer",
]

[project.scripts]
tanque = "tanque.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
# Inferência local (M5/M6), só para testes em CPU com modelo minúsculo:
#   uv sync --group infer
# Fora do CI principal: o CI instala só o grupo `dev`. No Kaggle, torch,
# transformers e peft já vêm na imagem (ver notebooks/README.md).
infer = [
    "torch>=2.4",
    "transformers>=4.53",
    "accelerate",
    "peft",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tanque"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
