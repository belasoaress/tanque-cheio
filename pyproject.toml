[project]
name = "tanque"
version = "0.1.0"
description = "Text-to-SQL em português sobre os preços de combustíveis da ANP."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic",
    "duckdb",
    "huggingface-hub",
    "polars",
    "pyarrow",
    "python-dotenv",
    "rapidfuzz",
    "sqlglot",
    "typer",
]

[project.scripts]
tanque = "tanque.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tanque"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
