# Configuração do tanque-cheio. Caminhos relativos partem da raiz do repositório.

[paths]
data_dir = "data"
raw_dir = "data/raw"
parquet_dir = "data/parquet"
db_path = "data/tanque.duckdb"
manifest = "data/manifest.json"
# Snapshot versionado (D25): Parquet normalizado do M1, commitado; o JSON ao lado guarda o
# SHA-256 e a contagem + MD5 de cada tabela. `tanque data build --from-parquet <snapshot>`.
snapshot = "snapshot/coletas-2026-09.parquet"
datasets_dir = "datasets"
results_dir = "results"
predictions_dir = "results/predictions"
spend_ledger = "results/spend.jsonl"
pricing = "configs/pricing.toml"

[data]
# Série histórica de preços de combustíveis automotivos da ANP (M1).
# Fonte: https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/serie-historica-de-precos-de-combustiveis
# Desde 2023 a ANP publica arquivos MENSAIS em .../arquivos/shpc/dsan/<ano>/, separados
# em "gasolina e etanol" e "diesel e GNV" (GLP em arquivo à parte, fora do escopo).
# Os nomes de 2026 são irregulares (ex.: "02-cados-abertos-preco-...", abril sem ".csv"),
# por isso as URLs ficam listadas uma a uma, copiadas dos links da página oficial.
# Os semestrais (.../shpc/dsas/ca/ca-AAAA-0S.zip) cobrem o mesmo conteúdo e não são usados.
period_start = "2024-10"  # 24 meses mais recentes disponíveis em 28/10/2026
period_end = "2026-09"
granularity = "mensal"
urls_verified = true      # links lidos da página oficial e baixados (HTTP 200) em 2026-10-28
urls_checked_on = 2026-10-28
license = "Dados abertos da ANP (Lei 12.527/2011; Decreto 8.777/2016), com atribuição à ANP"
# A página do conjunto não traz o campo de licença. O espelho CKAN do catálogo
# dados.gov.br (data.amerigeoss.org, "serie-historica-de-precos-de-combustiveis-por-revenda")
# lista "Creative Commons Attribution"; o rodapé do gov.br (CC BY-ND 3.0) cobre o conteúdo
# do site, não os dados. dados.gov.br não foi acessível daqui para confirmar.
license_verified = false
license_source = "https://data.amerigeoss.org/dataset/serie-historica-de-precos-de-combustiveis-por-revenda"
schema_doc = "docs/schema.md"

